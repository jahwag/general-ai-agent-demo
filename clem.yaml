project: gaidemo
primary_milestone: "Record one honest BookStack-to-Freshservice grounded assistance demo"
coordination:
  backend: github
  github_repo: "jahwag/general-ai-agent-demo"
  channels:
    tasks: "clem:todo"
    alerts: "1"
    lessons: "2"
operator:
  github_logins: ["jahwag"]
agents:
  copilot:
    name: "Cora"
    role: "Service Desk Copilot"
    runtime: codex
    model: gpt-5.6-luna
    effort: max
    iteration: 1m
    vaults: [github]
    rtk: true
    web_terminal_port: 7681
    prompt: >-
      Act as {{agent.name}} per AGENTS.md. Claim one synthetic demo task,
      create and validate a proposal, request autonomous publication of its
      private note, then stop for explicit metadata approval. Run `kill $PPID`
      when no task is available.
