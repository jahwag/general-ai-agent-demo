<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cora — AI-led service desk prototype</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #eef3f8;
        --muted: #9aa9bb;
        --panel: #111923;
        --panel-2: #172231;
        --line: #2a394d;
        --green: #56e39f;
        --blue: #70a5ff;
        --amber: #ffca64;
        --purple: #a98bff;
        --danger: #ff8d8d;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 1040px;
        min-height: 100vh;
        overflow: hidden;
        background: #0a1018;
        color: var(--ink);
        font: 15px/1.48 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button { font: inherit; }
      .prototype-note {
        position: fixed;
        top: 12px;
        right: 18px;
        z-index: 20;
        color: #7f8da0;
        font-size: 11px;
        letter-spacing: .11em;
        text-transform: uppercase;
      }
      .app { height: 100vh; display: grid; grid-template-rows: 72px 1fr; }
      .topbar {
        display: grid;
        grid-template-columns: 290px 1fr auto;
        align-items: center;
        gap: 22px;
        padding: 0 26px;
        border-bottom: 1px solid var(--line);
        background: rgba(10, 16, 24, .96);
      }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-mark {
        width: 38px; height: 38px; border-radius: 12px;
        display: grid; place-items: center;
        color: #071610; background: linear-gradient(135deg, #70f3ba, #36c98b);
        font-weight: 900; font-size: 20px;
      }
      .brand strong { display: block; font-size: 17px; }
      .brand small { color: var(--muted); }
      .tabs { display: flex; justify-content: center; gap: 8px; }
      .tab {
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 9px 14px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
      }
      .tab.active { color: var(--ink); border-color: var(--line); background: var(--panel-2); }
      .status-row { display: flex; align-items: center; gap: 9px; }
      .pill {
        display: inline-flex; align-items: center; gap: 7px;
        padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px;
        color: var(--muted); background: #0f1721; font-size: 12px;
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); }
      .shell { min-height: 0; }
      .view { height: 100%; }
      .hidden { display: none !important; }

      /* Variant A — conversation-first */
      .conversation-layout { height: 100%; display: grid; grid-template-columns: 235px minmax(560px, 1fr) 330px; }
      .channel-rail { padding: 22px 16px; border-right: 1px solid var(--line); background: #0d141e; }
      .rail-title { padding: 0 10px 16px; color: var(--muted); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
      .channel { padding: 10px 12px; border-radius: 9px; color: var(--muted); margin-bottom: 5px; }
      .channel.active { color: var(--ink); background: #1a2737; }
      .channel strong { color: var(--green); }
      .agent-card { margin-top: 28px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: #111a25; }
      .agent-line { display: flex; gap: 10px; align-items: center; }
      .avatar { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 10px; font-weight: 800; }
      .avatar.cora { color: #04140c; background: var(--green); }
      .avatar.bus { color: #06101e; background: var(--blue); }
      .avatar.human { color: #180d00; background: var(--amber); }
      .agent-card small { color: var(--muted); }
      .feed { min-height: 0; display: grid; grid-template-rows: auto 1fr auto; background: #101722; }
      .feed-head { padding: 20px 26px 14px; border-bottom: 1px solid var(--line); }
      .feed-head h1 { margin: 0 0 3px; font-size: 20px; }
      .feed-head p { margin: 0; color: var(--muted); }
      .messages { overflow-y: auto; padding: 18px 26px 10px; scrollbar-color: #33465e transparent; }
      .message { display: grid; grid-template-columns: 38px 1fr; gap: 12px; margin: 0 0 18px; animation: enter .38s ease-out; }
      .message-meta { display: flex; gap: 9px; align-items: baseline; margin-bottom: 4px; }
      .message-meta strong { font-size: 14px; }
      .message-meta time { color: #6f8094; font-size: 11px; }
      .message p { margin: 0; color: #d7e0ea; }
      .message code { color: #b9d2ff; background: #0a111a; border: 1px solid #26364b; border-radius: 5px; padding: 2px 5px; }
      .message-card { margin-top: 9px; padding: 11px 13px; border: 1px solid var(--line); border-left: 3px solid var(--blue); border-radius: 8px; background: #0d1520; }
      .message-card strong { display: block; margin-bottom: 4px; }
      .composer { padding: 12px 26px 18px; border-top: 1px solid var(--line); }
      .composer-box { display: flex; align-items: center; justify-content: space-between; padding: 11px 12px; border: 1px solid #3a4c63; border-radius: 10px; color: var(--muted); background: #0c131c; }
      .approval-button { border: 0; border-radius: 8px; padding: 8px 12px; color: #102016; background: var(--green); font-weight: 800; }
      .control-rail { padding: 22px; border-left: 1px solid var(--line); background: #0c131c; overflow: hidden; }
      .control-rail h2 { margin: 0 0 16px; font-size: 16px; }
      .control-step { position: relative; padding: 0 0 19px 28px; color: var(--muted); }
      .control-step::before { content: ""; position: absolute; left: 7px; top: 7px; bottom: -7px; width: 1px; background: var(--line); }
      .control-step:last-child::before { display: none; }
      .control-step::after { content: ""; position: absolute; left: 2px; top: 5px; width: 11px; height: 11px; border-radius: 50%; background: #203044; border: 2px solid #4b6077; }
      .control-step.done::after { background: var(--green); border-color: var(--green); }
      .control-step.current::after { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 11px rgba(255,202,100,.5); }
      .control-step strong { display: block; color: var(--ink); }
      .boundary { margin-top: 12px; padding: 13px; border: 1px solid #51411e; border-radius: 10px; color: #dcc58c; background: #1d1a11; font-size: 13px; }

      /* Variant B — audit timeline */
      .timeline-layout { height: 100%; padding: 26px 42px 40px; overflow: hidden; background: #0c121b; }
      .timeline-title { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 22px; }
      .timeline-title h1 { margin: 0; font-size: 27px; }
      .timeline-title p { margin: 4px 0 0; color: var(--muted); }
      .score { text-align: right; }
      .score strong { color: var(--green); font-size: 24px; }
      .audit-grid { display: grid; grid-template-columns: 1fr 310px; gap: 24px; }
      .timeline { position: relative; padding-left: 28px; }
      .timeline::before { content: ""; position: absolute; left: 8px; top: 7px; bottom: 14px; width: 2px; background: #26394e; }
      .event { position: relative; display: grid; grid-template-columns: 110px 1fr auto; gap: 16px; align-items: start; padding: 0 0 18px; }
      .event::before { content: ""; position: absolute; left: -25px; top: 7px; width: 11px; height: 11px; border-radius: 50%; background: var(--green); border: 3px solid #0c121b; box-shadow: 0 0 0 2px var(--green); }
      .event .time { color: var(--muted); font-variant-numeric: tabular-nums; }
      .event h3 { margin: 0 0 3px; font-size: 15px; }
      .event p { margin: 0; color: var(--muted); }
      .event .envelope { color: #8295ac; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .audit-panel { border: 1px solid var(--line); border-radius: 14px; padding: 18px; background: var(--panel); }
      .audit-panel h2 { margin: 0 0 16px; font-size: 16px; }
      .kv { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 9px 0; border-bottom: 1px solid #223043; color: var(--muted); }
      .kv strong { color: var(--ink); font-weight: 650; }

      /* Variant C — split operational cockpit */
      .split-layout { height: 100%; display: grid; grid-template-columns: 43% 57%; background: #0b1119; }
      .split-feed { min-width: 0; padding: 22px; border-right: 1px solid var(--line); overflow: hidden; }
      .split-feed h1 { margin: 0 0 5px; font-size: 23px; }
      .split-feed > p { margin: 0 0 18px; color: var(--muted); }
      .compact-message { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 11px 0; border-bottom: 1px solid #1e2b3b; }
      .compact-message .avatar { width: 30px; height: 30px; border-radius: 8px; font-size: 12px; }
      .compact-message strong { display: block; font-size: 13px; }
      .compact-message p { margin: 2px 0 0; color: #b5c2d2; font-size: 13px; }
      .ticket-pane { min-width: 0; display: grid; grid-template-rows: 46px 1fr; background: #eaf0f7; }
      .ticket-pane-head { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: #1b2c42; background: #f9fbfd; border-bottom: 1px solid #ccd7e3; }
      .ticket-frame { min-height: 0; padding: 10px; display: grid; place-items: center; }
      .ticket-frame img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: top; border: 1px solid #b9c7d6; box-shadow: 0 10px 26px rgba(20,31,45,.2); background: white; }

      .fresh-view { height: 100%; position: relative; padding: 12px; display: grid; place-items: center; background: #dce6f0; }
      .fresh-view img { width: 100%; height: 100%; object-fit: contain; object-position: center; background: white; box-shadow: 0 18px 50px rgba(10,24,42,.22); }
      .fresh-banner { position: absolute; top: 28px; left: 50%; transform: translateX(-50%); z-index: 2; padding: 10px 16px; border-radius: 999px; color: #102015; background: rgba(115,243,177,.96); box-shadow: 0 8px 24px rgba(3,12,20,.25); font-weight: 800; }
      .bus-view { height: 100%; position: relative; padding: 12px; display: grid; place-items: center; background: #080d14; }
      .bus-view img { width: 100%; height: 100%; object-fit: contain; object-position: center; }
      .bus-banner { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); z-index: 2; padding: 9px 15px; border: 1px solid #4f6d62; border-radius: 999px; color: #c9ffe7; background: rgba(9, 27, 22, .94); box-shadow: 0 8px 24px rgba(0,0,0,.35); font-weight: 800; }

      .switcher {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50;
        display: flex; gap: 6px; align-items: center; padding: 6px;
        border: 1px solid #52647a; border-radius: 999px; background: #eef3f8; color: #101927;
        box-shadow: 0 12px 32px rgba(0,0,0,.35);
      }
      .switcher button { border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer; color: inherit; background: transparent; }
      .switcher .variant-name { min-width: 218px; text-align: center; font-weight: 800; }
      body.recording .switcher, body.recording .prototype-note { display: none; }
      .recording .topbar { grid-template-columns: 290px 1fr 300px; }
      @keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </head>
  <body>
    <div class="prototype-note">Throwaway prototype · verified-run replay</div>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">C</div>
          <div><strong>Cora</strong><small>AI service desk copilot</small></div>
        </div>
        <nav class="tabs" aria-label="Demo views">
          <button class="tab active" data-tab="agent">Agent conversation</button>
          <button class="tab" data-tab="fresh">Freshservice</button>
          <button class="tab" data-tab="control">Control boundary</button>
          <button class="tab" data-tab="bus">AgentBus proof</button>
        </nav>
        <div class="status-row">
          <span class="pill"><span class="dot"></span> Verified AgentBus-style replay</span>
          <span class="pill">Synthetic ticket #1</span>
        </div>
      </header>

      <section class="shell">
        <div id="agent-view" class="view"></div>
        <div id="fresh-view" class="view fresh-view hidden">
          <div id="fresh-banner" class="fresh-banner">Before approval · read-only</div>
          <img id="fresh-image" src="/artifacts/freshworks-before.png" alt="Native Freshservice ticket" />
        </div>
        <div id="control-view" class="view timeline-layout hidden"></div>
        <div id="bus-view" class="view bus-view hidden">
          <div class="bus-banner">Actual AgentBus conversation · synthetic verified-run replay</div>
          <img src="/artifacts/agentbus-conversation-late.png" alt="Actual AgentBus operator conversation" />
        </div>
      </section>
    </main>

    <div class="switcher" aria-label="Prototype variants">
      <button id="previous" aria-label="Previous variant">←</button>
      <span id="variant-name" class="variant-name"></span>
      <button id="next" aria-label="Next variant">→</button>
    </div>

    <script>
      const variants = {
        A: "Conversation first",
        B: "Audit timeline",
        C: "Split cockpit",
      };
      const params = new URLSearchParams(location.search);
      let variant = variants[params.get("variant")] ? params.get("variant") : "A";
      let approved = params.get("complete") === "1";
      let activeTab = "agent";

      const allMessages = [
        { actor: "bus", name: "Freshservice intake", time: "10:05:03", html: "New synthetic incident <code>#1</code> assigned to Cora. Scope token permits reading this ticket only." },
        { actor: "cora", name: "Cora", time: "10:05:07", html: "I’ll read the thread, search the governed knowledge base, and prepare a proposal. I cannot write to Freshservice." },
        { actor: "cora", name: "Cora", time: "10:05:18", html: "Found a linked replacement-device issue: stale MFA registration plus incomplete managed-device enrolment.", card: "Evidence · <code>kb://mfa-recovery.md</code> · <code>kb://device-reenrollment.md</code> · <code>kb://wifi-managed-device.md</code>" },
        { actor: "cora", name: "Cora", time: "10:05:26", html: "Proposal <code>sha256:de2939f6…</code> is ready: private troubleshooting note, proposed category, and two audit tags." },
        { actor: "bus", name: "Approval gateway", time: "10:05:27", html: "No mutation performed. Exact human phrase <code>APPROVE</code> is required; ticket timestamp and proposal hash will be revalidated." },
        { actor: "human", name: "Jahziah · operator", time: "10:06:20", html: "<code>APPROVE</code>" },
        { actor: "bus", name: "Approval gateway", time: "10:06:21", html: "Approval bound to ticket #1 and proposal <code>de2939f6…</code>. Stale-ticket check passed. Applying the allowlisted private note and tags." },
        { actor: "cora", name: "Cora", time: "10:06:22", html: "Done. Freshservice confirms one private note plus <code>ai-assisted</code> and <code>human-approved</code>. Delivery acknowledged." },
      ];
      let visibleCount = approved ? allMessages.length : 5;

      function avatar(actor) {
        if (actor === "human") return '<div class="avatar human">J</div>';
        if (actor === "bus") return '<div class="avatar bus">↯</div>';
        return '<div class="avatar cora">C</div>';
      }

      function messageMarkup(message, compact = false) {
        if (compact) return `<div class="compact-message">${avatar(message.actor)}<div><strong>${message.name}</strong><p>${message.html}</p></div></div>`;
        return `<article class="message">${avatar(message.actor)}<div><div class="message-meta"><strong>${message.name}</strong><time>${message.time}</time></div><p>${message.html}</p>${message.card ? `<div class="message-card"><strong>Knowledge search complete</strong>${message.card}</div>` : ""}</div></article>`;
      }

      function stateSteps() {
        const states = [
          ["done", "Ticket detected", "Scoped read event delivered"],
          ["done", "Research complete", "3 verbatim KB citations"],
          ["done", "Proposal validated", "Schema + proposal hash"],
          [approved ? "done" : "current", "Human approval", approved ? "Exact phrase recorded" : "Waiting · no write"],
          [approved ? "done" : "", "Operator gateway", approved ? "Private note + tags applied" : "Credential remains sealed"],
        ];
        return states.map(([state, title, copy]) => `<div class="control-step ${state}"><strong>${title}</strong>${copy}</div>`).join("");
      }

      function renderA() {
        return `<div class="conversation-layout">
          <aside class="channel-rail">
            <div class="rail-title">Service desk</div>
            <div class="channel">⌂ Overview</div>
            <div class="channel active"><strong>#</strong> fs-ticket-1</div>
            <div class="channel"># knowledge-maintenance</div>
            <div class="channel"># escalations</div>
            <div class="agent-card"><div class="agent-line"><div class="avatar cora">C</div><div><strong>Cora</strong><small>Codex via Clem</small></div></div><div style="margin-top:10px;color:var(--muted);font-size:12px"><span class="dot" style="display:inline-block;margin-right:7px"></span>working within ticket scope</div></div>
          </aside>
          <section class="feed"><div class="feed-head"><h1># fs-ticket-1</h1><p>Durable execution conversation · AgentBus delivery and approval events</p></div><div class="messages">${allMessages.slice(0, visibleCount).map((m) => messageMarkup(m)).join("")}</div><div class="composer"><div class="composer-box"><span>${approved ? "Approval recorded · conversation is retained for audit" : "Human action required · proposal is read-only until approved"}</span><button class="approval-button">${approved ? "✓ APPROVED" : "APPROVE"}</button></div></div></section>
          <aside class="control-rail"><h2>Control boundary</h2>${stateSteps()}<div class="boundary"><strong>Credential isolation</strong><br />Cora never receives the Freshservice API key. Only the deterministic gateway can perform the allowlisted write.</div></aside>
        </div>`;
      }

      function renderB() {
        const events = allMessages.slice(0, visibleCount).map((m, index) => `<div class="event"><div class="time">${m.time}</div><div><h3>${m.name}</h3><p>${m.html}</p></div><div class="envelope">msg_${String(index + 1).padStart(4,"0")}<br>${index < 5 ? "ACK" : approved ? "ACK" : "PENDING"}</div></div>`).join("");
        return `<div class="timeline-layout"><div class="timeline-title"><div><h1>Ticket #1 execution trace</h1><p>Every agent decision, delivery, approval, and side effect in sequence</p></div><div class="score"><span class="pill">Policy checks</span><br><strong>${approved ? "8 / 8 passed" : "6 / 8 passed"}</strong></div></div><div class="audit-grid"><div class="timeline">${events}</div><aside class="audit-panel"><h2>Proposal envelope</h2><div class="kv"><span>Ticket scope</span><strong>#1 only</strong></div><div class="kv"><span>Model runtime</span><strong>Codex via Clem</strong></div><div class="kv"><span>Evidence</span><strong>3 citations</strong></div><div class="kv"><span>Write access</span><strong>Gateway only</strong></div><div class="kv"><span>Approval</span><strong>${approved ? "Human verified" : "Pending"}</strong></div><div class="kv"><span>Delivery</span><strong>${approved ? "Acknowledged" : "Durably waiting"}</strong></div><div class="boundary">AgentBus carries durable execution messages; it does not broaden Cora’s Freshservice permissions.</div></aside></div></div>`;
      }

      function renderC() {
        return `<div class="split-layout"><section class="split-feed"><h1>AI execution channel</h1><p>Cora reports progress while the operator keeps native Freshservice in view.</p>${allMessages.slice(0, visibleCount).map((m) => messageMarkup(m, true)).join("")}</section><section class="ticket-pane"><div class="ticket-pane-head"><strong>Freshservice · incident #1</strong><span>${approved ? "Approved result" : "Read-only before approval"}</span></div><div class="ticket-frame"><img src="${approved ? "/artifacts/freshworks-after.png" : "/artifacts/freshworks-before.png"}" alt="Freshservice ticket"></div></section></div>`;
      }

      function renderAgent() {
        const root = document.getElementById("agent-view");
        root.innerHTML = variant === "A" ? renderA() : variant === "B" ? renderB() : renderC();
        requestAnimationFrame(() => {
          const feed = root.querySelector(".messages");
          if (feed) feed.scrollTop = feed.scrollHeight;
        });
      }

      function renderControl() {
        document.getElementById("control-view").innerHTML = `<div class="timeline-title"><div><h1>Human control is a system boundary</h1><p>The AI drives the work, but it cannot approve or execute its own Freshservice mutation.</p></div><span class="pill"><span class="dot"></span> EU-oriented human oversight</span></div><div class="audit-grid"><div><div class="message-card"><strong>AI / Cora</strong>Detect ticket, summarize thread, search governed knowledge, quote evidence, categorize, and draft a structured proposal.</div><div class="message-card" style="border-left-color:var(--amber)"><strong>Human operator</strong>Review the proposal and citations; approve one immutable proposal hash with an exact action.</div><div class="message-card" style="border-left-color:var(--green)"><strong>Approval gateway</strong>Recheck ticket freshness, validate the proposal schema, and perform only the allowlisted private note and tag update.</div></div><aside class="audit-panel"><h2>What the demo proves</h2><div class="kv"><span>AI-led workflow</span><strong>Yes</strong></div><div class="kv"><span>Autonomous write</span><strong>No</strong></div><div class="kv"><span>Human approval</span><strong>Explicit</strong></div><div class="kv"><span>Credential exposed to model</span><strong>No</strong></div><div class="kv"><span>Native system evidence</span><strong>Freshservice</strong></div></aside></div>`;
      }

      function showTab(tab) {
        activeTab = tab;
        document.querySelectorAll(".tab").forEach((node) => node.classList.toggle("active", node.dataset.tab === tab));
        document.getElementById("agent-view").classList.toggle("hidden", tab !== "agent");
        document.getElementById("fresh-view").classList.toggle("hidden", tab !== "fresh");
        document.getElementById("control-view").classList.toggle("hidden", tab !== "control");
        document.getElementById("bus-view").classList.toggle("hidden", tab !== "bus");
        if (tab === "control") renderControl();
      }

      function updateFreshservice() {
        document.getElementById("fresh-image").src = approved ? "/artifacts/freshworks-after.png" : "/artifacts/freshworks-before.png";
        document.getElementById("fresh-banner").textContent = approved ? "After approval · private note + audit tags" : "Before approval · AI has read-only scope";
      }

      function setVariant(nextVariant) {
        variant = nextVariant;
        params.set("variant", variant);
        history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
        document.getElementById("variant-name").textContent = `${variant} — ${variants[variant]}`;
        renderAgent();
      }

      function cycle(direction) {
        const keys = Object.keys(variants);
        const nextIndex = (keys.indexOf(variant) + direction + keys.length) % keys.length;
        setVariant(keys[nextIndex]);
      }

      async function replay() {
        approved = false;
        visibleCount = 1;
        updateFreshservice();
        showTab("agent");
        renderAgent();
        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        for (let count = 2; count <= 5; count += 1) {
          await wait(2100);
          visibleCount = count;
          renderAgent();
        }
        await wait(1800);
        showTab("fresh");
        await wait(4300);
        showTab("agent");
        await wait(1700);
        visibleCount = 6;
        approved = true;
        renderAgent();
        await wait(2100);
        visibleCount = 7;
        renderAgent();
        await wait(2100);
        visibleCount = 8;
        updateFreshservice();
        renderAgent();
        await wait(3200);
        showTab("fresh");
        await wait(5200);
        showTab("control");
        await wait(4600);
        showTab("bus");
      }

      document.querySelectorAll(".tab").forEach((node) => node.addEventListener("click", () => showTab(node.dataset.tab)));
      document.getElementById("previous").addEventListener("click", () => cycle(-1));
      document.getElementById("next").addEventListener("click", () => cycle(1));
      document.addEventListener("keydown", (event) => {
        if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable) return;
        if (event.key === "ArrowLeft") cycle(-1);
        if (event.key === "ArrowRight") cycle(1);
      });
      if (params.get("record") === "1") document.body.classList.add("recording");
      document.getElementById("variant-name").textContent = `${variant} — ${variants[variant]}`;
      renderAgent();
      updateFreshservice();
      if (params.get("autoplay") === "1") setTimeout(replay, 900);
    </script>
  </body>
</html>
